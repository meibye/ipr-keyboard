{% extends "setup/base.html" %}
{% block content %}
<div class="card">
  <h2>{{ t['logs_title'] }}</h2>
  <p style="color:#666;font-size:.85rem;margin:0 0 .6rem">
    {{ t['logs_device_time'] }}: <code id="device-time">{{ device_time }}</code>
    &nbsp;·&nbsp; {{ t['logs_lines_note'] }}
  </p>
  <form method="get" action="{{ url_for('setup.logs') }}" id="logs-form">
    <div class="unit-list">
      {% for unit in all_units %}
      <label>
        <input type="checkbox" name="unit" value="{{ unit }}"
               {% if unit in selected_units %}checked{% endif %}>
        {{ unit }}
      </label>
      {% endfor %}
    </div>
    <div class="unit-list" style="margin-top:.2rem">
      <label><input type="checkbox" name="order" value="desc" {% if newest_first %}checked{% endif %}> {{ t['logs_newest_first'] }}</label>
      <label><input type="checkbox" name="follow" value="1" {% if follow %}checked{% endif %}> {{ t['logs_follow'] }}</label>
    </div>
    <button type="submit" class="btn btn-secondary btn-sm"
            style="display:inline-block;margin:.5rem 0">{{ t['logs_refresh'] }}</button>
  </form>
  <pre id="log-pre">{{ log_content }}</pre>
</div>
<script>
(function () {
  var pre = document.getElementById('log-pre');
  var newestFirst = {{ 'true' if newest_first else 'false' }};
  if (!newestFirst) { pre.scrollTop = pre.scrollHeight; }   // tail: newest at the bottom, start there
  {% if follow %}
  // Live: reload every 4 s.  A plain reload keeps the page simple and the
  // journal read cheap on a Zero; the form state is in the URL so it survives.
  setTimeout(function () { window.location.reload(); }, 4000);
  {% endif %}
  // Tick the device clock between reloads.
  var el = document.getElementById('device-time');
  var start = Date.now(), base = el.textContent;
  var m = base.match(/^(\d{4}-\d{2}-\d{2}) (\d{2}):(\d{2}):(\d{2}) (.*)$/);
  if (m) {
    var d = new Date(m[1] + 'T' + m[2] + ':' + m[3] + ':' + m[4]);
    setInterval(function () {
      var t = new Date(d.getTime() + (Date.now() - start));
      var p = function (n) { return String(n).padStart(2, '0'); };
      el.textContent = t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate()) + ' ' +
        p(t.getHours()) + ':' + p(t.getMinutes()) + ':' + p(t.getSeconds()) + ' ' + m[5];
    }, 1000);
  }
})();
</script>
{% endblock %}
